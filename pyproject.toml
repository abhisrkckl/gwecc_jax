
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwecc_jax"
version = "0.0.1"
description = "JAX-based tools for gravitational-wave analysis of eccentric binaries"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GNU GPLv3" }
authors = [
    { name = "Abhimanyu Susobhanan" }
]
dependencies = [
    "jax",
    "interpax",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "build",
    "numdifftools",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gwecc_jax = ["data/**/*", "data/*"]